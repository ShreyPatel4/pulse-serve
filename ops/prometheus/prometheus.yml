global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # api's own /metrics -- requests, latency, live queue depth (via the
  # custom collector in pulse_serve/metrics.py), model integrity flag.
  - job_name: pulse-serve-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # worker exposes its own /metrics via prometheus_client.start_http_server
  # (pulse_serve/worker.py) -- a separate process, separate registry, so
  # this is a distinct job rather than sharing the api target.
  - job_name: pulse-serve-worker
    static_configs:
      - targets: ["worker:9200"]
